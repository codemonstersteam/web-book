site_name: CodeMonsters.team
site_url: https://codemonsters.team
theme:
  name: material
  custom_dir: overrides
  logo: /cm-logo-header.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  font: false
  palette:
    - scheme: slate
      primary: black
      accent: cyan
extra_css:
  - stylesheets/crt.css

nav:
  - Книга кода:
      - codebook/index.md
      - codebook/1-codegen-machine.md
  - Блог: blog/index.md
  - Об авторе: about.md

plugins:
  - blog
extra:
  analytics:
    provider: yandex
  social:
    - icon: fontawesome/brands/github-alt
      link: https://git.codemonsters.team/guides/web-book
    - icon: fontawesome/brands/telegram
      link: https://t.me/codemonsterslogs
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/maximmorev/

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: |
  &copy; 2023 <a href="https://git.codemonsters.team/guides/web-book"  target="_blank" rel="noopener">CodeMonsters.team</a>